async function save(table,data,id,baseline){
 requireEditor();
 if(!['members','songs','services'].includes(table))throw new Error('Cadastro inválido.');
 const payload={...data};delete payload.id;
 const signature=table==='members'?payload.name:table==='songs'?payload.title+'|'+payload.artist:[payload.title,payload.service_date,payload.service_time,payload.location].join('|');

 await db.runTransaction(async tx=>{const existing=await tx.get(ref);if(!id&&existing.exists&&!existing.data().deleted)throw new Error('Este cadastro já existe. Atualize para conferir.');if(id&&!existing.exists)throw new Error('O registro foi removido por outro editor.');if(id){if(existing.data().deleted)throw new Error('Este registro foi removido em outro dispositivo.');if(baseline&&Object.keys(payload).some(k=>JSON.stringify(existing.data()[k]??'')!==JSON.stringify(baseline[k]??'')))throw new Error('Alguém alterou este cadastro. Feche e abra novamente para revisar antes de salvar.');tx.update(ref,payload);}else tx.set(ref,{...payload,deleted:false,...(table==='services'?{team:[],tracks:[]}:{}),created_at:existing.exists?existing.data().created_at:firebase.firestore.FieldValue.serverTimestamp()})});return ref.id;
}

let listeners=[],received=new Set();
function flattenServices(){state.service_members=state.services.flatMap(s=>(s.team||[]).map(m=>({...m,service_id:s.id})));state.service_songs=state.services.flatMap(s=>(s.tracks||[]).map((t,i)=>({...t,service_id:s.id,position:i+1})));}

function connectionError(e){$('status').textContent='Falha na conexão';$('connection-notice').innerHTML=`<div class="notice error">${escapeHTML(errorMessage(e))}${button('Tentar novamente','retry')}</div>`;render()}
async function load(){if(!db)return;try{await Promise.all(['members','songs','services'].map(async table=>receive(table,await db.collection(table).get({source:'server'}))))}catch(e){connectionError(e)}}
function listen(){listeners.forEach(stop=>stop());listeners=['members','songs','services'].map(table=>db.collection(table).onSnapshot({includeMetadataChanges:true},snap=>receive(table,snap),connectionError))}
async function start(){updateAuthUI();if(!config.projectId||!config.apiKey){$('status').textContent='Conexão pendente';render();return}if(!window.firebase){$('status').textContent='Falha ao iniciar';render();return}try{firebase.initializeApp(config);db=firebase.firestore();state.editor=true;listen()}catch(e){connectionError(e)}}
$('edit-form').addEventListener('submit',async e=>{e.preventDefault();if(state.busy||!modalSubmit)return;const data=Object.fromEntries([...new FormData(e.currentTarget).entries()].map(([k,v])=>[k,String(v).trim()]));if([...e.currentTarget.querySelectorAll('[required]')].some(i=>!String(i.value).trim())){$('form-error').textContent='Preencha os campos obrigatórios.';return}state.busy=true;const prior=$('save-button').textContent;$('save-button').disabled=true;$('cancel-modal').disabled=true;$('close-modal').disabled=true;$('save-button').textContent='Aguarde…';$('form-error').textContent='';try{const result=await modalSubmit(data);$('modal').close();modalSubmit=null;await load();if(result?.openService){state.service=result.openService;state.page='services'}if(prior!=='Enviar link de acesso')message(prior==='Excluir'?'Registro excluído.':'Alterações salvas.')}catch(error){$('form-error').textContent=errorMessage(error)}finally{state.busy=false;$('save-button').disabled=false;$('cancel-modal').disabled=false;$('close-modal').disabled=false;$('save-button').textContent=prior;if(!$('modal').open)render()}});
$('close-modal').onclick=closeModal;$('cancel-modal').onclick=closeModal;$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('refresh').onclick=()=>db?load():location.reload();
document.addEventListener('input',e=>{if(e.target.id==='member-search'){state.memberQuery=e.target.value;$('member-results').innerHTML=memberResults()}if(e.target.id==='song-search'){state.query=e.target.value;$('song-results').innerHTML=songResults()}});
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;state.service=null;render();return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const id=b.dataset.id;try{switch(b.dataset.action){case'upcoming':state.serviceView='upcoming';render();break;case'past':state.serviceView='past';render();break;case'retry':listen();await load();break;case'back':state.service=null;render();break;case'open-service':state.page='services';state.service=id;render();break;case'member':memberModal(id||undefined);break;case'song':songModal(id||undefined);break;case'service':serviceModal(id||undefined);break;case'assign':assignModal();break;case'assignment':assignModal(id);break;case'track':trackModal();break;case'edit-track':trackModal(id);break;case'up':await moveTrack(id,-1);break;case'down':await moveTrack(id,1);break;default:{const table={'delete-member':'members','delete-song':'songs','delete-service':'services','delete-track':'service_songs','delete-assignment':'service_members'}[b.dataset.action];if(table)confirmDelete(table,id)}}}catch(error){fail(error)}});
window.addEventListener('online',()=>db&&listen());window.addEventListener('offline',()=>{$('status').textContent='Sem conexão';message('Sem internet. Aguarde a conexão antes de salvar alterações.')});


function memberResults(){const q=normalize(state.memberQuery);return state.members.filter(m=>normalize(m.name+' '+m.role).includes(q)).map(m=>`<article class="item member-row"><div class="item-main"><span class="avatar">${escapeHTML(initials(m.name))}</span><div><strong>${escapeHTML(m.name)}</strong><small>${escapeHTML(m.role)}</small>${m.phone?`<small>${escapeHTML(m.phone)}</small>`:''}</div></div><div class="actions"><span class="badge ${m.active?'green':'muted'}">${m.active?'Ativo':'Inativo'}</span>${editButton('Editar','member',m.id)}${editButton('Excluir','delete-member',m.id,'danger')}</div></article>`).join('')||empty(q?'Nenhum integrante encontrado.':'Sua equipe começa aqui. Cadastre o primeiro integrante.')}
function normalize(value){return String(value||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase()}

function isPast(s,now=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const get=k=>parts.find(p=>p.type===k).value;return s.service_date+'T'+s.service_time.slice(0,5)<get('year')+'-'+get('month')+'-'+get('day')+'T'+get('hour')+':'+get('minute')}
function serviceCard(s,i,past){const n=tracksFor(s.id).length,t=teamFor(s.id).length;return `<article class="service-card ${!past&&i===0?'next-service':''}"><div class="calendar-date"><span>${new Date(s.service_date+'T12:00:00').toLocaleString('pt-BR',{month:'short'}).replace('.','')}</span><b>${s.service_date.slice(-2)}</b><small>${new Date(s.service_date+'T12:00:00').toLocaleString('pt-BR',{weekday:'short'}).replace('.','')}</small></div><div class="service-info"><span class="badge ${past?'muted':n&&t?'green':'orange'}">${past?'Realizado':n&&t?'Programação pronta':'Em preparação'}</span><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.service_time.slice(0,5))}${s.location?' · '+escapeHTML(s.location):''}</p><div class="service-counts"><span>${icon('music')}${n} ${n===1?'música':'músicas'}</span><span>${icon('users')}${t} ${t===1?'integrante':'integrantes'}</span></div></div><div class="service-actions">${button('Abrir programação','open-service',s.id,'primary')}${editButton('Editar','service',s.id)}${editButton('Excluir','delete-service',s.id,'danger')}</div></article>`}

document.addEventListener('change',e=>{if(e.target.id==='artist-filter'){state.artist=e.target.value;$('song-results').innerHTML=songResults()}});
let draggedTrack=null,dragOrder=null;
document.addEventListener('dragstart',e=>{const handle=e.target.closest('[data-drag-id]');if(!handle||state.busy)return;draggedTrack=handle.dataset.dragId;dragOrder=tracksFor(state.service).map(x=>x.id);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTrack)});
document.addEventListener('dragover',e=>{const card=e.target.closest('[data-track-id]');if(card&&draggedTrack){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));card.classList.add('drop-target')}});
document.addEventListener('drop',async e=>{const card=e.target.closest('[data-track-id]');if(!card||!draggedTrack)return;e.preventDefault();const from=draggedTrack,to=card.dataset.trackId,before=dragOrder;draggedTrack=null;await reorderTrack(from,to,before)});
document.addEventListener('dragend',()=>{draggedTrack=null;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))});
async function reorderTrack(from,to,before){if(from===to||state.busy)return;state.busy=true;try{await changeService(state.service,({tracks})=>{if(tracks.map(t=>t.id).join(',')!==before.join(','))throw new Error('A sequência mudou em outro dispositivo. Confira e tente novamente.');const a=tracks.findIndex(t=>t.id===from),b=tracks.findIndex(t=>t.id===to);if(a<0||b<0)throw new Error('A música não está mais nesta sequência.');const [track]=tracks.splice(a,1);tracks.splice(b,0,track);return {tracks}});message('Sequência atualizada.')}catch(e){fail(e)}finally{state.busy=false;await load()}}
let lastMinute='';setInterval(()=>{const minute=today()+currentTime();if(minute!==lastMinute&&state.loaded&&!state.busy&&!draggedTrack&&!$('modal').open){lastMinute=minute;if(state.page==='services')render()}},30000);
function icon(name){const paths={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18"/>',music:'<path d="M9 18V5l12-2v13M9 9l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/>',grip:'<path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01"/>',note:'<path d="M12 8v4m0 4h.01"/><circle cx="12" cy="12" r="9"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.music}</svg>`}

let touchDrag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag-id]');if(!h||e.pointerType==='mouse'||state.busy)return;touchDrag={id:h.dataset.dragId,target:h.dataset.dragId,startY:e.clientY,order:tracksFor(state.service).map(t=>t.id),handle:h};draggedTrack=touchDrag.id;h.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!touchDrag)return;if(Math.abs(e.clientY-touchDrag.startY)<6)return;const card=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-track-id]');if(card){touchDrag.target=card.dataset.trackId;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));card.classList.add('drop-target')}if(e.clientY>window.innerHeight-110)window.scrollBy(0,12);else if(e.clientY<100)window.scrollBy(0,-12)});
document.addEventListener('pointerup',async()=>{if(!touchDrag)return;const d=touchDrag;touchDrag=null;draggedTrack=null;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));await reorderTrack(d.id,d.target,d.order)});
document.addEventListener('pointercancel',()=>{touchDrag=null;draggedTrack=null;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))});
start();

});</script></body></html>
