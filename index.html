;window.addEventListener('DOMContentLoaded',()=>{

const songBy=id=>state.songs.find(s=>s.id===id)||state.service_songs.find(s=>s.song_id===id)?.song_snapshot;
const tracksFor=id=>state.service_songs.filter(s=>s.service_id===id).sort((a,b)=>a.position-b.position||a.id.localeCompare(b.id));
const teamFor=id=>state.service_members.filter(m=>m.service_id===id);
const initials=name=>name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase();
const empty=text=>`<div class="empty">${escapeHTML(text)}</div>`;
const button=(text,action,id='',className='secondary',extra='')=>`<button class="${className}" data-action="${action}" data-id="${escapeHTML(id)}" ${extra}>${escapeHTML(text)}</button>`;
const editButton=(...args)=>state.editor?button(...args):'';
const heading=(title,description,action,label)=>`<div class="page-head"><div><h1>${escapeHTML(title)}</h1><p>${escapeHTML(description)}</p></div>${action?editButton(label,action,'','primary'):''}</div>`;
function link(url,label){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?`<a class="text-link" href="${escapeHTML(u.href)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:''}catch{return ''}}
function message(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,5500)}
function errorMessage(error){if(error?.code==='23505')return 'Este registro já existe. Atualize a página para conferir.';if(error?.code==='permission-denied'||error?.code==='42501'||error?.status===403)return 'Seu acesso não permite esta alteração. Entre com uma conta de editor autorizada.';if(error?.code==='resource-exhausted')return 'A cota gratuita do banco foi atingida. Aguarde a renovação da cota ou fale com o responsável.';if(error?.message?.includes('Failed to fetch'))return 'Não foi possível conectar. Verifique a internet e tente novamente.';return error?.message||'Não foi possível concluir. Tente novamente.'}

 if(!state.loaded){$('content').innerHTML=heading('Tudo começa com a próxima canção.','A programação compartilhada estará disponível assim que a conexão estiver pronta.')+`<section class="panel"><h2>${db?'Aguardando a programação':'Estamos preparando este espaço'}</h2>${empty(db?'Use Atualizar para tentar carregar novamente.':'O responsável ainda precisa concluir a conexão do ministério. Nenhum dado foi salvo neste dispositivo.')}</section>`;return}
 $('content').innerHTML=state.page==='dashboard'?dashboard():state.page==='members'?membersPage():state.page==='songs'?songsPage():servicesPage();
}
function dashboard(){const next=upcoming()[0],team=next?teamFor(next.id):[],tracks=next?tracksFor(next.id):[];
 return heading('Vamos preparar o próximo culto.','Escalas, canções e cada detalhe para servir em unidade.')+`<div class="stats"><div class="stat"><div><small>Integrantes ativos</small><strong>${state.members.filter(m=>m.active).length}</strong></div><span class="stat-icon" aria-hidden="true">♧</span></div><div class="stat"><div><small>No repertório</small><strong>${state.songs.length}</strong></div><span class="stat-icon" aria-hidden="true">♫</span></div><div class="stat"><div><small>Próximos cultos</small><strong>${upcoming().length}</strong></div><span class="stat-icon" aria-hidden="true">▦</span></div></div><div class="dashboard-grid"><div><section class="panel hero"><span class="eyebrow">NOSSO PRÓXIMO ENCONTRO</span>${next?`<div class="date-block"><b>${next.service_date.slice(-2)}</b><span>${new Date(next.service_date+'T12:00:00').toLocaleString('pt-BR',{month:'short'})}</span></div><h2>${escapeHTML(next.title)}</h2><p>${shortDate(next.service_date)} · ${escapeHTML(next.service_time.slice(0,5))}<br>${escapeHTML(next.location||'Local a definir')} · ${tracks.length} ${tracks.length===1?'música':'músicas'}</p>${button('Ver planejamento','open-service',next.id,'primary')}`:`<h2>Um novo encontro<br>começa aqui.</h2>${empty('Ainda não há cultos futuros na programação.')}${editButton('Programar culto','service','','primary')}`}</section><section class="panel"><div class="panel-head"><h2>Sequência musical</h2><span class="pill">${tracks.length} MÚSICAS</span></div>${tracks.length?tracks.map((t,i)=>trackRow(t,i,false)).join(''):empty('As músicas do próximo culto aparecerão aqui.')}</section></div><div><section class="panel"><div class="panel-head"><h2>Equipe escalada</h2><span class="pill">${team.length} PESSOAS</span></div>${team.length?team.map(m=>teamRow(m,false)).join(''):empty('A equipe do próximo culto ainda não foi escalada.')}</section><section class="panel"><div class="panel-head"><h2>Próximos encontros</h2></div>${upcoming().slice(0,4).map(s=>`<div class="item"><div><strong>${escapeHTML(s.title)}</strong><small>${shortDate(s.service_date)} · ${escapeHTML(s.service_time.slice(0,5))}</small></div>${button('Ver','open-service',s.id)}</div>`).join('')||empty('Nenhum encontro programado.')}</section><section class="panel"><h2>Avisos para a equipe</h2>${next?.notes?`<p class="notes">${escapeHTML(next.notes)}</p>`:empty('Sem avisos para o próximo culto.')}</section></div></div>`;
}
function membersPage(){return heading('Quem faz parte.','Músicos, vozes e pessoas que cuidam de cada detalhe.','member','+ Novo integrante')+`<section class="panel"><div class="panel-head"><h2>Equipe do ministério</h2><span class="pill">${state.members.length} INTEGRANTES</span></div>${state.members.map(m=>`<div class="item"><div class="item-main"><span class="avatar">${escapeHTML(initials(m.name))}</span><div><strong>${escapeHTML(m.name)}</strong><small>${escapeHTML(m.role)} · ${m.active?'Ativo':'Inativo'}</small></div></div><div class="actions">${editButton('Editar','member',m.id)}${editButton('Excluir','delete-member',m.id,'danger')}</div></div>`).join('')||empty('Nenhum integrante cadastrado. Os cadastros feitos pelos editores aparecerão aqui.')}</section>`}
function songsPage(){return heading('Canções para compartilhar.','Repertório do ministério, com tons e referências para estudar.','song','+ Nova música')+`<div class="search"><label for="song-search">Buscar música</label><input id="song-search" type="search" placeholder="Nome da música ou ministério" value="${escapeHTML(state.query)}"></div><div id="song-results" class="catalog">${songResults()}</div>`}
function songResults(){const q=state.query.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();const songs=state.songs.filter(s=>(s.title+' '+s.artist).normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().includes(q));return songs.map(s=>`<section class="panel song-card"><div class="panel-head"><span class="pill orange">TOM ${escapeHTML(s.song_key||'A DEFINIR')}</span><span class="pill">${s.bpm?escapeHTML(s.bpm)+' BPM':'BPM LIVRE'}</span></div><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.artist||'Ministério não informado')}</p>${s.notes?`<p>${escapeHTML(s.notes)}</p>`:''}<div>${link(s.youtube_url,'Ouvir música')}${link(s.chords_url,'Ver cifra')}</div>${state.editor?`<div class="actions">${editButton('Editar música','song',s.id)}${editButton('Excluir','delete-song',s.id,'danger')}</div>`:''}</section>`).join('')||empty(q?'Nenhuma música encontrada.':'O repertório ainda está vazio.')}
function servicesPage(){if(state.service)return serviceDetail();return heading('Cada culto, um planejamento.','Organize a equipe e a sequência das músicas.','service','+ Novo culto')+`<section class="panel">${[...state.services].sort((a,b)=>(b.service_date+b.service_time).localeCompare(a.service_date+a.service_time)).map(s=>`<div class="item"><div class="item-main"><span class="track-number">${s.service_date.slice(-2)}</span><div><strong>${escapeHTML(s.title)}</strong><small>${shortDate(s.service_date)} · ${escapeHTML(s.service_time.slice(0,5))} · ${escapeHTML(s.location||'Local a definir')}</small></div></div><div class="actions">${button('Planejamento','open-service',s.id,'primary')}${editButton('Editar','service',s.id)}${editButton('Excluir','delete-service',s.id,'danger')}</div></div>`).join('')||empty('Nenhum culto cadastrado.')}</section>`}
function serviceDetail(){const s=state.services.find(x=>x.id===state.service);if(!s){state.service=null;return servicesPage()}const team=teamFor(s.id),tracks=tracksFor(s.id);return button('← Todos os cultos','back')+`<div class="detail-spacer"></div>`+heading(s.title,`${shortDate(s.service_date)} · ${s.service_time.slice(0,5)}`)+`<div class="details-meta"><span>${escapeHTML(s.location||'Local a definir')}</span><span>${team.length} integrantes</span><span>${tracks.length} músicas</span>${editButton('Editar culto','service',s.id)}</div>${s.notes?`<section class="panel"><h2>Avisos e observações</h2><p class="notes">${escapeHTML(s.notes)}</p></section>`:''}<div class="two-columns"><section class="panel"><div class="panel-head"><h2>Equipe escalada</h2>${editButton('+ Escalar','assign','','primary')}</div>${team.map(m=>teamRow(m,true)).join('')||empty('Nenhum integrante escalado.')}</section><section class="panel"><div class="panel-head"><h2>Sequência musical</h2>${editButton('+ Música','track','','primary')}</div>${tracks.map((t,i)=>trackRow(t,i,true,tracks.length)).join('')||empty('Selecione músicas do repertório para este culto.')}</section></div>`}
function teamRow(m,editing){const member=memberBy(m.member_id);return `<div class="item"><div class="item-main"><span class="avatar">${escapeHTML(initials(member?.name||'?'))}</span><div><strong>${escapeHTML(member?.name||'Integrante removido')}</strong><small>${escapeHTML(m.function_name)}${member&&!member.active?' · Inativo':''}</small></div></div>${editing?`<div class="actions">${editButton('Função','assignment',m.member_id)}${editButton('Remover','delete-assignment',m.member_id,'danger')}</div>`:''}</div>`}
function trackRow(t,i,editing,total=0){const song=songBy(t.song_id);return `<div class="item"><div class="item-main"><span class="track-number">${String(i+1).padStart(2,'0')}</span><div><strong>${escapeHTML(song?.title||'Música removida')}</strong><small>${escapeHTML(song?.artist||'')} · Tom <b>${escapeHTML(t.chosen_key||song?.song_key||'a definir')}</b></small>${t.notes?`<p>${escapeHTML(t.notes)}</p>`:''}<div>${link(song?.youtube_url,'Ouvir')}${link(song?.chords_url,'Cifra')}</div></div></div>${editing?`<div class="actions">${editButton('↑','up',t.id,'secondary',`aria-label="Subir ${escapeHTML(song?.title)}" ${i===0?'disabled':''}`)}${editButton('↓','down',t.id,'secondary',`aria-label="Descer ${escapeHTML(song?.title)}" ${i===total-1?'disabled':''}`)}${editButton('Tom e notas','edit-track',t.id)}${editButton('Remover','delete-track',t.id,'danger')}</div>`:''}</div>`}
function input(label,name,value='',type='text',required=false,max=180){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${escapeHTML(value)}" ${required?'required':''} ${type==='number'?'min="20" max="300" step="1"':`maxlength="${max}"`}>`}
function area(label,name,value='',max=4000){return `<label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" maxlength="${max}">${escapeHTML(value)}</textarea>`}
function select(label,name,choices,value=''){return `<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" required>${choices.map(([id,text])=>`<option value="${escapeHTML(id)}" ${String(id)===String(value)?'selected':''}>${escapeHTML(text)}</option>`).join('')}</select>`}
function requireEditor(){if(!state.editor)throw new Error('Aguarde a conexão para alterar a programação.')}
function modal(title,fields,submit,saveLabel='Salvar'){if(state.busy)return;$('modal-title').textContent=title;$('fields').innerHTML=fields;$('form-error').textContent='';$('save-button').textContent=saveLabel;modalSubmit=submit;$('modal').showModal()}
function closeModal(){if(state.busy)return;$('modal').close();modalSubmit=null;if(db)load()}
async function save(table,data,id){
 requireEditor();
 if(!['members','songs','services'].includes(table))throw new Error('Cadastro inválido.');
 const payload={...data};delete payload.id;
 const signature=table==='members'?payload.name:table==='songs'?payload.title+'|'+payload.artist:[payload.title,payload.service_date,payload.service_time,payload.location].join('|');
 const normalized=signature.normalize('NFD').replace(/\p{Diacritic}/gu,'').trim().toLowerCase();
 const key=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normalized)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 const ref=db.collection(table).doc(id||key);
 await db.runTransaction(async tx=>{const existing=await tx.get(ref);if(!id&&existing.exists&&!existing.data().deleted)throw new Error('Este cadastro já existe. Atualize para conferir.');if(id&&!existing.exists)throw new Error('O registro foi removido por outro editor.');if(id)tx.update(ref,payload);else tx.set(ref,{...payload,deleted:false,...(table==='services'?{team:[],tracks:[]}:{}),created_at:firebase.firestore.FieldValue.serverTimestamp()})});
}
async function changeService(serviceId,change){requireEditor();const ref=db.collection('services').doc(serviceId);await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)throw new Error('Culto não encontrado.');const data=snap.data();const next=change({team:data.team||[],tracks:data.tracks||[]});tx.update(ref,next)})}
function memberModal(id){requireEditor();const m=memberBy(id),newId=crypto.randomUUID();modal(m?'Editar integrante':'Novo integrante',input('Nome','name',m?.name,'text',true,120)+input('Função principal','role',m?.role||'Vocalista','text',true,80)+'<datalist id="roles">'+['Vocalista','Ministro de louvor','Tecladista','Baterista','Guitarrista','Violonista','Baixista','Sonoplasta','Mídia'].map(r=>`<option value="${r}">`).join('')+'</datalist>'+select('Situação','active',[[true,'Ativo'],[false,'Inativo']],m?.active??true),d=>save('members',{...(!m?{id:newId}:{}),name:d.name,role:d.role,active:d.active==='true'},id));$('f-role').setAttribute('list','roles')}
function songModal(id){requireEditor();const s=songBy(id),newId=crypto.randomUUID();modal(s?'Editar música':'Nova música',input('Nome da música','title',s?.title,'text',true,180)+input('Cantor ou ministério original','artist',s?.artist,'text',false,140)+input('Tom original','song_key',s?.song_key,'text',false,24)+input('BPM (opcional)','bpm',s?.bpm||'','number')+input('Link do YouTube','youtube_url',s?.youtube_url,'url',false,1200)+input('Link da cifra','chords_url',s?.chords_url,'url',false,1200)+area('Observações','notes',s?.notes),d=>save('songs',{...d,...(!s?{id:newId}:{}),bpm:d.bpm?Number(d.bpm):null},id))}
function serviceModal(id){requireEditor();const s=state.services.find(x=>x.id===id),newId=crypto.randomUUID();modal(s?'Editar culto':'Novo culto',input('Nome do culto','title',s?.title||'Culto de Louvor','text',true,160)+input('Data','service_date',s?.service_date||today(),'date',true)+input('Horário (Brasília)','service_time',s?.service_time?.slice(0,5)||'19:00','time',true)+input('Local','location',s?.location,'text',false,180)+area('Avisos e observações da equipe','notes',s?.notes)+'<p class="notes">Este culto sai da programação 3 dias após o cadastro. A limpeza do banco ocorre diariamente.</p>',d=>save('services',{...d,...(!s?{id:newId}: {})},id))}
function assignModal(id){requireEditor();const serviceId=state.service,existing=teamFor(serviceId).find(m=>m.member_id===id);const available=state.members.filter(m=>m.active&&!teamFor(serviceId).some(x=>x.member_id===m.id));if(!existing&&!available.length)return message('Não há integrantes ativos disponíveis para escalar.');modal(existing?'Editar função':'Escalar integrante',(existing?`<p>${escapeHTML(memberBy(id)?.name)}</p>`:select('Integrante','member_id',available.map(m=>[m.id,m.name])))+input('Função neste culto','function_name',existing?.function_name||available[0]?.role,'text',true,100),d=>changeService(serviceId,({team})=>{const memberId=id||d.member_id;const index=team.findIndex(m=>m.member_id===memberId);if(!existing&&index>=0)throw new Error('Este integrante já está escalado.');if(existing&&index<0)throw new Error('Esta escala mudou. Atualize e tente novamente.');if(existing)team[index]={...team[index],function_name:d.function_name};else team.push({member_id:memberId,function_name:d.function_name,member_snapshot:memberBy(memberId)});return {team}}));if(!existing)$('f-member_id').addEventListener('change',e=>$('f-function_name').value=memberBy(e.target.value)?.role||'')}
function trackModal(id){requireEditor();const serviceId=state.service,t=state.service_songs.find(x=>x.id===id),newId=crypto.randomUUID();const available=state.songs.filter(s=>!tracksFor(serviceId).some(x=>x.song_id===s.id));if(!t&&!available.length)return message('Não há músicas disponíveis. Cadastre uma música no repertório.');modal(t?'Tom e observações':'Adicionar música',(t?`<p>${escapeHTML(songBy(t.song_id)?.title)}</p>`:select('Música','song_id',available.map(s=>[s.id,s.title])))+input('Tom neste culto (vazio usa o original)','chosen_key',t?.chosen_key,'text',false,24)+area('Observações para este culto','notes',t?.notes,2000),d=>changeService(serviceId,({tracks})=>{if(t){const index=tracks.findIndex(x=>x.id===id);if(index<0)throw new Error('A música foi removida deste culto.');tracks[index]={...tracks[index],...d}}else{if(tracks.some(x=>x.id===newId))return {tracks};if(tracks.some(x=>x.song_id===d.song_id))throw new Error('Esta música já está no culto.');tracks.push({...d,id:newId,song_snapshot:songBy(d.song_id)})}return {tracks}}))}
function confirmDelete(table,id){requireEditor();const serviceId=state.service;const names={members:memberBy(id)?.name,songs:songBy(id)?.title,services:state.services.find(s=>s.id===id)?.title,service_songs:songBy(state.service_songs.find(t=>t.id===id)?.song_id)?.title,service_members:memberBy(id)?.name};const note=['members','songs'].includes(table)?'O histórico nos cultos existentes será preservado.':table==='services'?'A equipe e a sequência musical deste culto também serão removidas.':'O cadastro original será mantido.';modal('Confirmar exclusão',`<p>Excluir <strong>${escapeHTML(names[table]||'este registro')}</strong>?</p><p class="notes">${note} Confirme para remover da programação.</p>`,async()=>{if(table==='service_members')await changeService(serviceId,({team})=>({team:team.filter(m=>m.member_id!==id)}));else if(table==='service_songs')await changeService(serviceId,({tracks})=>({tracks:tracks.filter(t=>t.id!==id)}));else await db.collection(table).doc(id).update({deleted:true});if(table==='services')state.service=null},'Excluir')}
async function moveTrack(id,direction){requireEditor();if(state.busy)return;const tracks=tracksFor(state.service),index=tracks.findIndex(t=>t.id===id),target=index+direction;if(target<0||target>=tracks.length)return;const before=tracks.map(t=>t.id);state.busy=true;try{await changeService(state.service,({tracks})=>{if(tracks.map(t=>t.id).join(',')!==before.join(','))throw new Error('A sequência mudou em outro dispositivo. Atualize e tente novamente.');[tracks[index],tracks[target]]=[tracks[target],tracks[index]];return {tracks}});await load();message('Ordem das músicas atualizada.')}catch(e){fail(e);await load()}finally{state.busy=false}}
let listeners=[],received=new Set();
function flattenServices(){state.service_members=state.services.flatMap(s=>(s.team||[]).map(m=>({...m,service_id:s.id})));state.service_songs=state.services.flatMap(s=>(s.tracks||[]).map((t,i)=>({...t,service_id:s.id,position:i+1})));}
function receive(table,snapshot){state[table]=snapshot.docs.filter(d=>!d.data().deleted&&(table!=='services'||!d.data().created_at||d.data().created_at.toMillis()+259200000>Date.now())).map(d=>({...d.data(),id:d.id}));received.add(table);flattenServices();state.members.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));state.songs.sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));state.loaded=received.size===3;$('connection-notice').innerHTML='';$('status').textContent=snapshot.metadata.fromCache?'Reconectando…':'Sincronizado';if(!$('modal').open)render()}
function connectionError(e){$('status').textContent='Falha na conexão';$('connection-notice').innerHTML=`<div class="notice error">${escapeHTML(errorMessage(e))}${button('Tentar novamente','retry')}</div>`;render()}
async function load(){if(!db)return;try{await Promise.all(['members','songs','services'].map(async table=>receive(table,await db.collection(table).get({source:'server'}))))}catch(e){connectionError(e)}}
function listen(){listeners.forEach(stop=>stop());listeners=['members','songs','services'].map(table=>db.collection(table).onSnapshot({includeMetadataChanges:true},snap=>receive(table,snap),connectionError))}
async function start(){updateAuthUI();if(!config.projectId||!config.apiKey){$('status').textContent='Conexão pendente';render();return}if(!window.firebase){$('status').textContent='Falha ao iniciar';render();return}try{firebase.initializeApp(config);db=firebase.firestore();state.editor=true;listen()}catch(e){connectionError(e)}}
$('edit-form').addEventListener('submit',async e=>{e.preventDefault();if(state.busy||!modalSubmit)return;const data=Object.fromEntries([...new FormData(e.currentTarget).entries()].map(([k,v])=>[k,String(v).trim()]));if([...e.currentTarget.querySelectorAll('[required]')].some(i=>!String(i.value).trim())){$('form-error').textContent='Preencha os campos obrigatórios.';return}state.busy=true;const prior=$('save-button').textContent;$('save-button').disabled=true;$('cancel-modal').disabled=true;$('close-modal').disabled=true;$('save-button').textContent='Aguarde…';$('form-error').textContent='';try{await modalSubmit(data);$('modal').close();modalSubmit=null;await load();if(prior!=='Enviar link de acesso')message(prior==='Excluir'?'Registro excluído.':'Alterações salvas.')}catch(error){$('form-error').textContent=errorMessage(error)}finally{state.busy=false;$('save-button').disabled=false;$('cancel-modal').disabled=false;$('close-modal').disabled=false;$('save-button').textContent=prior}});
$('close-modal').onclick=closeModal;$('cancel-modal').onclick=closeModal;$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('refresh').onclick=()=>db?load():location.reload();
document.addEventListener('input',e=>{if(e.target.id==='song-search'){state.query=e.target.value;$('song-results').innerHTML=songResults()}});
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;state.service=null;render();return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const id=b.dataset.id;try{switch(b.dataset.action){case'retry':listen();await load();break;case'back':state.service=null;render();break;case'open-service':state.page='services';state.service=id;render();break;case'member':memberModal(id||undefined);break;case'song':songModal(id||undefined);break;case'service':serviceModal(id||undefined);break;case'assign':assignModal();break;case'assignment':assignModal(id);break;case'track':trackModal();break;case'edit-track':trackModal(id);break;case'up':await moveTrack(id,-1);break;case'down':await moveTrack(id,1);break;default:{const table={'delete-member':'members','delete-song':'songs','delete-service':'services','delete-track':'service_songs','delete-assignment':'service_members'}[b.dataset.action];if(table)confirmDelete(table,id)}}}catch(error){fail(error)}});
window.addEventListener('online',()=>db&&listen());window.addEventListener('offline',()=>{$('status').textContent='Sem conexão';message('Sem internet. Aguarde a conexão antes de salvar alterações.')});
start();

});</script></body></html>
